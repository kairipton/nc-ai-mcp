[project]
name = "nc-ai-mcp"
version = "0.1.0"
description = "MCP servers for NC AI API Platform (VARCO Sound, ...) used by Claude"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
